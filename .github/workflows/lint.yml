name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint (Ruff, Djlint, Prettier, Markdownlint, Pyright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      # 12 of the hooks in .pre-commit-config.yaml are basicly's and their entry is
      # `uv run --no-project python .basicly/core/hooks/...`, so uv has to be on PATH
      # for the pre-commit step below. Pinned rather than relying on whatever the
      # runner image happens to ship.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit run (all files)
        run: pre-commit run --all-files

      - name: Install project dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pyright type check
        run: pyright data/ callbacks/ ui/ visualization/ tests/

  # Until 2026-09-10 CI ran no tests at all, so a red suite could merge and ship.
  # The unit suite is green and deterministic, so it gates. The integration suite
  # is currently red and order-dependent, so it reports without blocking -- see
  # the job below.
  unit-tests:
    name: Unit tests (blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install project dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (unit, with coverage ratchet)
        run: |
          pytest tests/unit/ -n auto -m "not performance" \
            --cov=data --cov=ui --cov=visualization --cov=callbacks \
            --cov-config=pyproject.toml --cov-report=term-missing \
            --cov-fail-under=40 -q

  # Blocking. This job was briefly reporting-only while tests/integration/ had 16
  # ordering-dependent problems; IMP-006 fixed the leak causing them, and the three
  # genuine product bugs that remain are marked xfail(strict=True) with an IMP-005
  # reference. Strict means a fix makes the run red until the marker is removed, so
  # nothing is silently swept up.
  integration-tests:
    name: Integration tests (blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install project dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (integration)
        run: pytest tests/integration/ -p no:randomly -q
