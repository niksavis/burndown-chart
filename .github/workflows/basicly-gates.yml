# Scaffolded by `basicly install`; yours to edit — install never overwrites it.
name: basicly-gates

# Tracker-only pushes skip CI: the harness loop necessarily commits tracker state
# separately from the work, and the local commit-msg hooks are the deterministic
# floor for those commits. Both stores are named while both exist.
"on":
  push:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            range="${base_sha}..${head_sha}"
          else
            before_sha="${{ github.event.before }}"
            zeros="0000000000000000000000000000000000000000"
            if [ -z "${before_sha}" ] || [ "${before_sha}" = "${zeros}" ]; then
              range="${{ github.sha }}"
            else
              range="${before_sha}..${{ github.sha }}"
            fi
          fi
          echo "Checking commit messages in range: ${range}"
          failed=0
          while IFS= read -r sha; do
            [ -z "${sha}" ] && continue
            msg_file="$(mktemp)"
            git log -1 --format='%B' "${sha}" > "${msg_file}"
            python3 .basicly/core/hooks/commit-msg.py "${msg_file}" || failed=1
            python3 .basicly/core/hooks/tracker-commit-msg.py "${msg_file}" || failed=1
            rm -f "${msg_file}"
          done < <(git log --format='%H' "${range}")
          exit "${failed}"

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Catalog lint
        run: uvx --from git+https://github.com/niksavis/basicly@v0.21.0 basicly catalog lint
      - name: Projection drift check
        run: uvx --from git+https://github.com/niksavis/basicly@v0.21.0 basicly check
      - name: Skill projection drift check
        run: uvx --from git+https://github.com/niksavis/basicly@v0.21.0 basicly skills-check
      - name: Hook wiring drift check
        run: uvx --from git+https://github.com/niksavis/basicly@v0.21.0 basicly hooks-check
      # `basicly verify` is deliberately not a step here. No checks are declared under
      # [verify] in basicly.toml, so `--mode full` passes vacuously -- it printed
      # "No verify checks configured for mode 'full'" and then PASS. A green step that
      # asserts nothing is worse than an absent one, because the name implies coverage.
      # The real gates are in lint.yml (ruff, bandit, djlint, prettier, detect-secrets,
      # pyright, unit and integration suites); declaring them again under [verify] would
      # duplicate them rather than add anything. Add the step back if [verify] ever gains
      # a check lint.yml does not already run.
