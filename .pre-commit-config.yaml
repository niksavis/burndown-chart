repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.2
  hooks:
  - id: ruff-check
    args: [--fix]
    # basicly writes these; `basicly skills-build` restores any rewrite.
    exclude: ^(\.basicly/core|\.claude/skills|\.agents/skills)/
  - id: ruff-format
    exclude: ^(\.basicly/|\.claude/skills/|\.agents/skills/)

- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args: ['-c', 'pyproject.toml', '--severity-level', 'medium', '--confidence-level', 'medium']
        # Only scan project source; skip tests, vendor, and generated code
    files: ^(data|callbacks|ui|visualization|app\.py)

- repo: https://github.com/Riverside-Healthcare/djLint
  rev: v1.36.4
  hooks:
  - id: djlint-jinja
    files: report_assets/.*\.(html|j2|jinja)$
    types_or: [html, jinja]
    args: [--reformat]

- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
  hooks:
  - id: prettier
    additional_dependencies:
    - prettier@3.6.2
    files: \.(js|css|json|yml|yaml)$
    # basicly writes these and flattens YAML list indentation; prettier re-indents
    # it, so each would undo the other on every commit. `.basicly-local/` is the
    # overlay: our own fragments, but basicly's format, scaffolded by `catalog new
    # fragment` in the same flat style and re-read by its loader.
    exclude: |
      (?x)^(
        \.basicly/.*|
        \.basicly-local/.*|
        \.pre-commit-config\.yaml|
        \.github/workflows/basicly-gates\.yml
      )$

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.45.0
  hooks:
  - id: markdownlint
    args: [--config, .markdownlint.json]
    # basicly projects these; its own markdownlint hook below checks them.
    exclude: |
      (?x)^(
        \.basicly/core/.*|
        \.claude/skills/.*|
        \.agents/skills/.*|
        \.claude/CLAUDE\.md|
        AGENTS\.md|
        \.github/copilot-instructions\.md
      )$

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: ['--baseline', '.secrets.baseline']
        # Exclude auto-generated lock files and vendor bundles, and the tracker
        # ledger: every `created` event carries a `payload.import_digest`, the
        # sha256 of the import source, which reads as a high-entropy hex string.
        # 702 of them after the beads import, and more on every future import.
    exclude: |
      (?x)^(
        requirements.*\.txt|
        package-lock\.json|
        assets/vendor/.*|
        \.basicly/ledger/.*|
        \.basicly/core/.*
      )$
- repo: local
  hooks:
  - id: markdownlint
    name: markdownlint
    entry: uv run --no-project python .basicly/core/hooks/markdownlint.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    files: \.md$
  - id: identity-guard
    name: identity-guard
    entry: uv run --no-project python .basicly/core/hooks/identity-guard.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: pre-commit-script
    name: pre-commit-script
    entry: uv run --no-project python .basicly/core/hooks/pre-commit.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: catalog-lint
    name: catalog-lint
    entry: uv run --no-project python .basicly/core/hooks/catalog-lint.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    files: ^(\.basicly/core/|\.basicly-local/|basicly\.toml$)
  - id: secret-scan
    name: secret-scan
    entry: uv run --no-project python .basicly/core/hooks/secret-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: tracker-path-scan
    name: tracker-path-scan
    entry: uv run --no-project python .basicly/core/hooks/tracker-path-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: internal-info-scan
    name: internal-info-scan
    entry: uv run --no-project python .basicly/core/hooks/internal-info-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: no-comments
    name: no-comments
    entry: uv run --no-project python .basicly/core/hooks/no-comments.py
    language: system
    stages:
    - pre-commit
    pass_filenames: true
    files: \.(py|pyi|js|jsx|mjs|cjs|ts|tsx|mts|cts|java|kt|kts|cs|c|cc|cpp|cxx|h|hpp|go|rs|swift|scala|php|m|mm|css|scss|sass|less|html|htm|xhtml|vue|svelte|cshtml|razor|sh|bash|zsh|ksh|ps1|psm1|psd1|sql|vb|vbs)$
  - id: kit-boundary
    name: kit-boundary
    entry: uv run --no-project python .basicly/core/hooks/kit-boundary.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: commit-msg-script
    name: commit-msg-script
    entry: uv run --no-project python .basicly/core/hooks/commit-msg.py
    language: system
    stages:
    - commit-msg
    pass_filenames: true
  - id: tracker-commit-msg-script
    name: tracker-commit-msg-script
    entry: uv run --no-project python .basicly/core/hooks/tracker-commit-msg.py
    language: system
    stages:
    - commit-msg
    pass_filenames: true
  - id: tracker-claim-script
    name: tracker-claim-script
    entry: uv run --no-project python .basicly/core/hooks/tracker-claim.py
    language: system
    stages:
    - commit-msg
    pass_filenames: true
  - id: pre-push-script
    name: pre-push-script
    entry: uv run --no-project python .basicly/core/hooks/pre-push.py
    language: system
    stages:
    - pre-push
    pass_filenames: false
    always_run: true
  - id: protect-generated-commit
    name: protect-generated-commit
    entry: uv run --no-project python .basicly/core/hooks/protect-generated-commit.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
