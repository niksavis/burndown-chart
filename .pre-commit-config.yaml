repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.2
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
    # Vendored, upstream-managed Python formatted at basicly's line-length 100.
    # ruff-check still covers it; only the rewrite is suppressed.
    exclude: ^\.basicly/

- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args: ['-c', 'pyproject.toml', '--severity-level', 'medium', '--confidence-level', 'medium']
        # Only scan project source; skip tests, vendor, and generated code
    files: ^(data|callbacks|ui|visualization|app\.py)

- repo: https://github.com/Riverside-Healthcare/djLint
  rev: v1.36.4
  hooks:
  - id: djlint-jinja
    files: report_assets/.*\.(html|j2|jinja)$
    types_or: [html, jinja]
    args: [--reformat]

- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
  hooks:
  - id: prettier
    additional_dependencies:
    - prettier@3.6.2
    files: \.(js|css|json|yml|yaml)$
    # basicly writes these and flattens YAML list indentation; prettier re-indents
    # it, so each would undo the other on every commit.
    exclude: |
      (?x)^(
        \.basicly/.*|
        \.pre-commit-config\.yaml|
        \.github/workflows/basicly-gates\.yml
      )$

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.45.0
  hooks:
  - id: markdownlint
    args: [--config, .markdownlint.json]

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: ['--baseline', '.secrets.baseline']
        # Exclude auto-generated lock files and vendor bundles, and the tracker
        # ledger: every `created` event carries a `payload.import_digest`, the
        # sha256 of the import source, which reads as a high-entropy hex string.
        # 702 of them after the beads import, and more on every future import.
    exclude: |
      (?x)^(
        requirements.*\.txt|
        package-lock\.json|
        assets/vendor/.*|
        \.basicly/ledger/.*
      )$
- repo: local
  hooks:
  - id: identity-guard
    name: identity-guard
    entry: uv run python .basicly/core/hooks/identity-guard.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: pre-commit-script
    name: pre-commit-script
    entry: uv run python .basicly/core/hooks/pre-commit.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: catalog-lint
    name: catalog-lint
    entry: uv run python .basicly/core/hooks/catalog-lint.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    files: ^(\.basicly/core/|\.basicly-local/|basicly\.toml$)
  - id: secret-scan
    name: secret-scan
    entry: uv run python .basicly/core/hooks/secret-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: tracker-path-scan
    name: tracker-path-scan
    entry: uv run python .basicly/core/hooks/tracker-path-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: internal-info-scan
    name: internal-info-scan
    entry: uv run python .basicly/core/hooks/internal-info-scan.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: kit-boundary
    name: kit-boundary
    entry: uv run python .basicly/core/hooks/kit-boundary.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
  - id: commit-msg-script
    name: commit-msg-script
    entry: uv run python .basicly/core/hooks/commit-msg.py
    language: system
    stages:
    - commit-msg
    pass_filenames: true
  - id: tracker-commit-msg-script
    name: tracker-commit-msg-script
    entry: uv run python .basicly/core/hooks/tracker-commit-msg.py
    language: system
    stages:
    - commit-msg
    pass_filenames: true
  - id: pre-push-script
    name: pre-push-script
    entry: uv run python .basicly/core/hooks/pre-push.py
    language: system
    stages:
    - pre-push
    pass_filenames: false
    always_run: true
  - id: protect-generated-commit
    name: protect-generated-commit
    entry: uv run python .basicly/core/hooks/protect-generated-commit.py
    language: system
    stages:
    - pre-commit
    pass_filenames: false
    always_run: true
