[pytest]
# 31 tests under tests/ and tests/visual/ are NOT collected by this setting. They
# pass in isolation, but widening testpaths to `tests` was measured on 2026-09-10
# to take the suite from 5 failures / 11 errors to 53 / 33: the extra modules
# perturb collection order and the suite has module-level state leakage between
# tests (IMP-006 in docs/improvement_backlog.md). Collecting them is IMP-009 and
# is blocked on that fix -- widening first would only bury it.
testpaths = tests/unit tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    performance: mark test as a performance test
    integration: mark test as an integration test
    unit: mark test as a unit test
    requires_app: mark test as requiring a live app server
    browser: mark test as requiring browser automation
    slow: mark test as slow-running (> 1 second)
    profile_tests: mark test as profile management test
    query_tests: mark test as query management test
    migration_tests: mark test as migration/upgrade test
    ui_tests: mark test as UI component test
    timeout: mark test with a timeout limit in seconds
